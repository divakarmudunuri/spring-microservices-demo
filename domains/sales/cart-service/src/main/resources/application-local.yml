cart:
  dynamodb:
    endpoint: http://localhost:8000   # DynamoDB Local (docker/docker-compose.yml)
    create-table: true

spring.cloud.openfeign.client.config.product-service.logger-level: basic

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.smd.cartservice.client: debug

# --- Observability: every trace, readable text logs
management.tracing.sampling.probability: 1.0
logging.structured.format.console: ""
