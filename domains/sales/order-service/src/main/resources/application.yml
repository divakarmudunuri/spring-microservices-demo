server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: order_svc
    password: ${ORDER_DB_PASSWORD:order_local_pw}   # local-only default (data-model/sql/00-create-databases.sql)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # JPA maps to the Flyway schema, never the other way round
  flyway:
    locations: classpath:db/migration
