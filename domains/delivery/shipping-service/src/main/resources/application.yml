server:
  port: 8085

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: shipping-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # map every record to this service's own envelope class; never trust the producer's type headers
        spring.json.value.default.type: com.smd.shippingservice.events.EventEnvelope
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.smd.shippingservice.events
    producer:
      # the outbox payload is already the JSON envelope
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    listener:
      ack-mode: record   # commit each offset after the listener's transaction committed
  mvc:
    problemdetails:
      enabled: true   # framework errors (400, 404, 405, ...) as RFC 7807 too
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://localhost:5432/shipping_db
    username: shipping_svc
    password: ${SHIPPING_DB_PASSWORD:shipping_local_pw}   # local-only default (data-model/sql/00-create-databases.sql)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # JPA maps to the Flyway schema, never the other way round
  flyway:
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

kafka:
  consumed-topics: fulfillment-events
  topics:
    partitions: 3
    replicas: 1

outbox:
  relay:
    enabled: true
    interval: 500ms
    batch-size: 100
    send-timeout: 10s

demo:
  simulation:
    enabled: true
    step-delay: 10s
    poll-interval: 1s
    carrier: DEMO-EXPRESS
    delivery-days: 3

security:
  internal:
    # the internal issuer's public keys, from user-service by service name (Eureka)
    jwk-set-uri: http://user-service/.well-known/jwks.json
