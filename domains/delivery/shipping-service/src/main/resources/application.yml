server:
  port: 8085

spring:
  mvc:
    problemdetails:
      enabled: true   # framework errors (400, 404, 405, ...) as RFC 7807 too
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://localhost:5432/shipping_db
    username: shipping_svc
    password: ${SHIPPING_DB_PASSWORD:shipping_local_pw}   # local-only default (data-model/sql/00-create-databases.sql)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # JPA maps to the Flyway schema, never the other way round
  flyway:
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
