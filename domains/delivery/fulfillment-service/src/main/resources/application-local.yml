demo:
  simulation:
    # fast, so a demo order reaches PACKED in a few seconds; raise failure-rate to see the refund path
    step-delay: 2s
    failure-rate: 0.0
    poll-interval: 500ms

# --- Observability: every trace, readable text logs
management.tracing.sampling.probability: 1.0
logging.structured.format.console: ""
