server:
  port: 8084

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fulfillment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # map every record to this service's own envelope class; never trust the producer's type headers
        spring.json.value.default.type: com.smd.fulfillmentservice.events.EventEnvelope
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.smd.fulfillmentservice.events
    producer:
      # the outbox payload is already the JSON envelope
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    listener:
      ack-mode: record   # commit each offset after the listener's transaction committed
  mvc:
    problemdetails:
      enabled: true   # framework errors (400, 404, 405, ...) as RFC 7807 too
  application:
    name: fulfillment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fulfillment_db
    username: fulfillment_svc
    password: ${FULFILLMENT_DB_PASSWORD:fulfillment_local_pw}   # local-only default (data-model/sql/00-create-databases.sql)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       # JPA maps to the Flyway schema, never the other way round
  flyway:
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

kafka:
  consumed-topics: order-events
  topics:
    partitions: 3
    replicas: 1

outbox:
  relay:
    enabled: true
    interval: 500ms
    batch-size: 100
    send-timeout: 10s

demo:
  simulation:
    enabled: true
    step-delay: 10s
    failure-rate: 0.0
    poll-interval: 1s
    warehouse-code: WH-DETROIT-1

security:
  internal:
    # the internal issuer's public keys, from user-service by service name (Eureka)
    jwk-set-uri: http://user-service/.well-known/jwks.json

# --- Observability (CLAUDE.md 6.10) ---------------------------------------------------------------
# Dotted keys, so this section merges with any nested `management:` / `spring:` / `logging:` blocks above.
management.endpoints.web.exposure.include: health, info, metrics, prometheus
# traces: OTLP to Jaeger. 10% sampling by default; the local profile samples everything
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# no spans for the security filter chain or @Scheduled pollers (outbox relay, simulators): noise in Jaeger
management.observations.enable.spring.security: false
management.observations.enable.tasks.scheduled: false
# metrics: every series says which service it came from; histograms for p95/p99 latency in Grafana
management.metrics.tags.application: ${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests: true
# /actuator/health/readiness: dependencies this instance needs to serve traffic (liveness stays separate)
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState, db, kafka
# Kafka spans: the producer injects traceparent into record headers, the listener continues it
spring.kafka.template.observation-enabled: true
spring.kafka.listener.observation-enabled: true
# logs: trace id, span id, correlation id and (where known) order id on every line
logging.include-application-name: false   # it's the first field of the correlation pattern below
logging.pattern.correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{orderId:-}] "
# structured JSON (Elastic Common Schema, MDC fields included) everywhere except local
logging.structured.format.console: ecs
