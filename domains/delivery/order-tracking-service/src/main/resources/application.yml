server:
  port: 8086

spring:
  mvc:
    problemdetails:
      enabled: true   # framework errors (400, 404, 405, ...) as RFC 7807 too
  application:
    name: order-tracking-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-tracking-service
      auto-offset-reset: earliest       # a new group (e.g. a rebuild) reads every topic from the start
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # a record that isn't valid JSON doesn't crash the listener: it goes straight to the DLT
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # map every record to this service's own envelope class; never trust the producer's type headers
        spring.json.value.default.type: com.smd.ordertrackingservice.events.EventEnvelope
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.smd.ordertrackingservice.events
    producer:
      # used only to publish failed records to the DLTs
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 10000   # don't stall the partition for 60 s if the DLT can't be reached
    listener:
      ack-mode: record   # commit each record's offset after the listener returned successfully

tracking:
  # every order-related topic (not inventory-events)
  topics: order-events,fulfillment-events,shipping-events
  dynamodb:
    table-name: order_tracking
    region: us-east-1
    create-table: false
    api-call-timeout: 2s
    api-call-attempt-timeout: 700ms

kafka:
  topics:
    partitions: 3
    replicas: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  internal:
    # the internal issuer's public keys, from user-service by service name (Eureka)
    jwk-set-uri: http://user-service/.well-known/jwks.json

# --- Observability (CLAUDE.md 6.10) ---------------------------------------------------------------
# Dotted keys, so this section merges with any nested `management:` / `spring:` / `logging:` blocks above.
management.endpoints.web.exposure.include: health, info, metrics, prometheus
# traces: OTLP to Jaeger. 10% sampling by default; the local profile samples everything
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# no spans for the security filter chain or @Scheduled pollers (outbox relay, simulators): noise in Jaeger
management.observations.enable.spring.security: false
management.observations.enable.tasks.scheduled: false
# metrics: every series says which service it came from; histograms for p95/p99 latency in Grafana
management.metrics.tags.application: ${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests: true
# /actuator/health/readiness: dependencies this instance needs to serve traffic (liveness stays separate)
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState, trackingTable, kafka
# Kafka spans: the producer injects traceparent into record headers, the listener continues it
spring.kafka.template.observation-enabled: true
spring.kafka.listener.observation-enabled: true
# logs: trace id, span id, correlation id and (where known) order id on every line
logging.include-application-name: false   # it's the first field of the correlation pattern below
logging.pattern.correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{orderId:-}] "
# structured JSON (Elastic Common Schema, MDC fields included) everywhere except local
logging.structured.format.console: ecs
