# Scrapes every service's /actuator/prometheus. The services run on the host,
# so targets are host.docker.internal:<port> (ports from CLAUDE.md section 3).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8761   # discovery-server
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8088   # storefront-bff
          - host.docker.internal:8082   # user-service
          - host.docker.internal:8083   # product-service
          - host.docker.internal:8087   # cart-service
          - host.docker.internal:8081   # order-service
          - host.docker.internal:8084   # fulfillment-service
          - host.docker.internal:8085   # shipping-service
          - host.docker.internal:8086   # order-tracking-service
