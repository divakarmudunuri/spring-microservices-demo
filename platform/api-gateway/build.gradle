plugins {
    id 'spring-service-conventions'
    id 'security-conventions'   // OAuth2 resource server (reactive here: the gateway is WebFlux)
}

// Reactive (WebFlux): never add spring-boot-starter-web here.

dependencies {
    implementation libs.spring.cloud.starter.gateway
    // per-route circuit breakers (the gateway's CircuitBreaker filter is reactive)
    implementation libs.spring.cloud.starter.circuitbreaker.reactor.resilience4j
    implementation libs.caffeine

    testImplementation libs.wiremock.standalone
}
