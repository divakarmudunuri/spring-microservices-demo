# Every version in the build lives here (CLAUDE.md section 3).
# Libraries without a version are managed by the Spring Boot, Spring Cloud or AWS SDK BOMs.

[versions]
spring-boot = "3.5.16"
spring-cloud = "2025.0.3"            # release train for Boot 3.5
dependency-management = "1.1.7"
aws-sdk = "2.55.11"
wiremock = "3.13.2"

[libraries]
# BOMs (imported by the convention plugins)
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }

# Gradle plugins, used by build-logic
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "dependency-management" }

# Spring Boot starters
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Observability
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Spring Cloud
spring-cloud-starter-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-starter-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
feign-hc5 = { module = "io.github.openfeign:feign-hc5" }
feign-micrometer = { module = "io.github.openfeign:feign-micrometer" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3" }

# Kafka
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# DynamoDB
aws-dynamodb-enhanced = { module = "software.amazon.awssdk:dynamodb-enhanced" }

# Security
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# Testing
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
awaitility = { module = "org.awaitility:awaitility" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
