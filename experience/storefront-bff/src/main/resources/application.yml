server:
  port: 8088

spring:
  mvc:
    problemdetails:
      enabled: true   # framework errors (400, 404, 405, ...) as RFC 7807 too
  application:
    name: storefront-bff

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Resilience4j annotations sit on the adapter, so Feign's own circuit-breaker wrapping stays off,
# and Resilience4j owns retries (LoadBalancer's retry off).
spring.cloud.loadbalancer.retry.enabled: false
spring.cloud.openfeign:
  circuitbreaker:
    enabled: false
  httpclient:
    hc5:
      enabled: true
    max-connections: 100
    max-connections-per-route: 50
  client:
    config:
      product-service:
        connect-timeout: 1000
        read-timeout: 2000
        logger-level: none

composition:
  core-pool-size: 16
  max-pool-size: 32
  queue-capacity: 100
  # overall limit per section; a page never waits longer than this for one call
  deadline: 3s

resilience4j:
  retry:
    retry-aspect-order: 1   # Retry( CircuitBreaker( Bulkhead( call ))); the bulkhead is always innermost
    instances:
      productService:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - com.smd.storefrontbff.client.product.DownstreamServerException
          - feign.RetryableException
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      productService:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.smd.storefrontbff.client.product.DownstreamServerException
          - feign.RetryableException
        ignore-exceptions:
          - com.smd.storefrontbff.client.product.ProductNotFoundException
        register-health-indicator: true
        allow-health-indicator-to-fail: false
  bulkhead:
    instances:
      productService:
        max-concurrent-calls: 20
        max-wait-duration: 50ms

security:
  internal:
    # the internal issuer's public keys, from user-service by service name (Eureka)
    jwk-set-uri: http://user-service/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus

# --- Observability (CLAUDE.md 6.10) ---------------------------------------------------------------
# Dotted keys, so this section merges with any nested `management:` / `spring:` / `logging:` blocks above.
# traces: OTLP to Jaeger. 10% sampling by default; the local profile samples everything
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# no spans for the security filter chain or @Scheduled pollers (outbox relay, simulators): noise in Jaeger
management.observations.enable.spring.security: false
management.observations.enable.tasks.scheduled: false
# metrics: every series says which service it came from; histograms for p95/p99 latency in Grafana
management.metrics.tags.application: ${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.endpoint.health.probes.enabled: true
# logs: trace id, span id, correlation id and (where known) order id on every line
logging.include-application-name: false   # it's the first field of the correlation pattern below
logging.pattern.correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{orderId:-}] "
# structured JSON (Elastic Common Schema, MDC fields included) everywhere except local
logging.structured.format.console: ecs
