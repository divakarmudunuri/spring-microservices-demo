# Require a customer session (Google, via oauth2-proxy-customer).
# On success, oauth2-proxy returns "Authorization: Bearer <Google ID token>",
# which we forward to the gateway. The gateway validates it against Google's
# keys and exchanges it for an internal JWT.
auth_request      /_auth/customer;
auth_request_set  $customer_bearer  $upstream_http_authorization;
auth_request_set  $customer_cookie  $upstream_http_set_cookie;   # refreshed session cookie, if any
proxy_set_header  Authorization     $customer_bearer;
add_header        Set-Cookie        $customer_cookie;
include           /etc/nginx/snippets/security-headers.conf;
