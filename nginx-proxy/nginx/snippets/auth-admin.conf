# Require an admin session (Okta, via oauth2-proxy-admin, which also checks that
# the user is in the Okta admin group). On success, oauth2-proxy returns the Okta
# ACCESS token in X-Auth-Request-Access-Token; we forward it as a bearer token.
auth_request      /_auth/admin;
auth_request_set  $admin_access_token $upstream_http_x_auth_request_access_token;
auth_request_set  $admin_cookie       $upstream_http_set_cookie;
proxy_set_header  Authorization       "Bearer $admin_access_token";
add_header        Set-Cookie          $admin_cookie;
include           /etc/nginx/snippets/security-headers.conf;
