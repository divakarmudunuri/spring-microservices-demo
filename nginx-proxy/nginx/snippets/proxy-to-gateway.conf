# Common settings for every request forwarded to the API gateway.
proxy_pass         http://gateway;
proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;
proxy_set_header   X-Correlation-Id  $correlation_id;
# Never forward identity headers a client might have sent itself.
proxy_set_header   X-Auth-Request-User         "";
proxy_set_header   X-Auth-Request-Email        "";
proxy_set_header   X-Auth-Request-Groups       "";
proxy_set_header   X-Auth-Request-Access-Token "";
proxy_set_header   X-Forwarded-Access-Token    "";
proxy_connect_timeout 3s;
proxy_read_timeout    30s;
# nginx sets these itself (security-headers.conf); drop the backend's copies so each appears once
proxy_hide_header  X-Frame-Options;
proxy_hide_header  X-Content-Type-Options;
proxy_hide_header  X-Correlation-Id;
