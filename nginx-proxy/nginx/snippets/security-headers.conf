# Included in the server block AND in every location that uses add_header
# (nginx drops inherited add_header directives as soon as a location has its own).
add_header X-Content-Type-Options  "nosniff" always;
add_header X-Frame-Options         "DENY" always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
# Angular needs inline styles; scripts come only from this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://*.okta.com" always;
add_header X-Correlation-Id        $correlation_id always;
# Turn on once served over HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
