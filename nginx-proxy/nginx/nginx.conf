# =============================================================================
# nginx.conf — edge proxy for spring-microservices-demo
# Main context only. The site (server block) is generated at container start
# from templates/default.conf.template (env vars filled in by envsubst).
# =============================================================================
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- logging: one JSON line per request, with the correlation id --------
    log_format  json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id","correlation_id":"$correlation_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
    access_log  /var/log/nginx/access.log  json;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;                     # don't advertise the nginx version
    client_max_body_size 1m;                    # the API only takes small JSON bodies

    gzip               on;
    gzip_types         application/json application/problem+json application/javascript text/css image/svg+xml;
    gzip_min_length    1024;

    # Docker's embedded DNS. Used for the oauth2-proxy upstreams (set via
    # variables) so nginx can start even when the login containers are not running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    # ---- correlation id: keep the caller's, or use nginx's request id --------
    map $http_x_correlation_id $correlation_id {
        ""       $request_id;
        default  $http_x_correlation_id;
    }

    # ---- CSRF guard ----------------------------------------------------------
    # Logged-in browsers authenticate with a session COOKIE (set by oauth2-proxy),
    # and the browser sends cookies automatically, so cross-site forms could
    # trigger state changes. Defense: every state-changing API call must carry
    # "X-Requested-With: XMLHttpRequest". Browsers won't add a custom header
    # cross-site without a CORS preflight, and we allow no cross-origin calls.
    # (The session cookies are also SameSite=Lax.)
    map "$request_method:$http_x_requested_with" $csrf_reject {
        default                  1;
        "~^(GET|HEAD|OPTIONS):"  0;
        "~:XMLHttpRequest$"      0;
    }

    # ---- rate limits (per client IP) -----------------------------------------
    limit_req_zone $binary_remote_addr zone=catalog:10m rate=30r/s;   # anonymous browsing
    limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;   # everything else under /api
    limit_req_zone $binary_remote_addr zone=login:10m   rate=1r/s;    # starting a login
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
